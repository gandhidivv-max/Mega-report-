name: Run Mega Automation

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  run-mega:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pycryptodome mega.py requests pillow

      - name: Run Mega Automation Script
        env:
          MEGA_EMAIL_1: ${{ secrets.MEGA_EMAIL_1 }}
          MEGA_PASSWORD_1: ${{ secrets.MEGA_PASSWORD_1 }}
          MEGA_EMAIL_2: ${{ secrets.MEGA_EMAIL_2 }}
          MEGA_PASSWORD_2: ${{ secrets.MEGA_PASSWORD_2 }}
          MEGA_EMAIL_3: ${{ secrets.MEGA_EMAIL_3 }}
          MEGA_PASSWORD_3: ${{ secrets.MEGA_PASSWORD_3 }}
          MEGA_EMAIL: ${{ secrets.MEGA_EMAIL }}
          MEGA_PASSWORD: ${{ secrets.MEGA_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python mega_telegram_report.py

      - name: Commit and Push Updated State File
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add mega_state.json
          git commit -m "Update mega_state.json" || exit 0
          git push
          
