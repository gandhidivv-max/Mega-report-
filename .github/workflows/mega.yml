name: Mega Cloud Automation Task

on:
  repository_dispatch:
    types: [run-mega-task]
  workflow_dispatch:

jobs:
  run-mega-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Mega Automation Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEGA_EMAIL_1: ${{ secrets.MEGA_EMAIL_1 }}
          MEGA_PASSWORD_1: ${{ secrets.MEGA_PASSWORD_1 }}
          MEGA_EMAIL_2: ${{ secrets.MEGA_EMAIL_2 }}
          MEGA_PASSWORD_2: ${{ secrets.MEGA_PASSWORD_2 }}
        run: python mega_telegram_report.py

      - name: Commit and Push Updated State File
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add mega_state.json
          git commit -m "Auto update mega_state.json" || exit 0
          git push
          
