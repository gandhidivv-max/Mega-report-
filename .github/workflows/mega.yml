name: Run Mega Script

on:
  workflow_dispatch: # కేవలం మీరు మాన్యువల్‌గా రన్ చేయడానికి మాత్రమే

jobs:
  run-mega:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install mega.py requests

      - name: Run Mega Automation Script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MEGA_EMAIL_1: ${{ secrets.MEGA_EMAIL_1 }}
          MEGA_PASSWORD_1: ${{ secrets.MEGA_PASSWORD_1 }}
          MEGA_EMAIL_2: ${{ secrets.MEGA_EMAIL_2 }}
          MEGA_PASSWORD_2: ${{ secrets.MEGA_PASSWORD_2 }}
        run: python mega_telegram_report.py

      - name: Commit and Push Updated State File
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase
          git add mega_state.json
          git commit -m "Update mega_state.json" || exit 0
          git push origin main
          
